[package]
name = "legend-chat-history-gpui"
version = "0.1.0"
edition = "2024"

[dependencies]
raw-window-handle = "0.6"
chat-history-rust = { path = "../../packages/chat-history-rust" }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
gpui = "0.2.2"
pulldown-cmark = "0.13.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig", "dump-load", "dump-create"] }
two-face = { version = "0.5.1", features = ["syntect-default-onig"], optional = true }

[features]
grammar-builder = ["dep:two-face"]

[[bin]]
name = "export-grammar-pack"
path = "tools/export-grammar-pack.rs"
required-features = ["grammar-builder"]

[workspace]
